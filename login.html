<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riyaz Trade | Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#101820;color:#fff;font-family:Arial,sans-serif;padding:20px}
.box{width:100%;max-width:400px;background:#192631;border:1px solid #304250;border-radius:15px;padding:25px}
h1{text-align:center;color:#21d6a3;margin-bottom:5px}
.subtitle{text-align:center;color:#aab9c5;margin-bottom:25px}
.tabs{display:flex;gap:10px;margin-bottom:20px}
.tabs button{flex:1;padding:12px;border:0;border-radius:7px;background:#304250;color:white;cursor:pointer}
.tabs button.active{background:#08a878}
label{display:block;margin:12px 0 7px;color:#d6e0e7}
input{width:100%;padding:13px;border-radius:7px;border:1px solid #405260;background:#101820;color:white;font-size:16px}
.submit{width:100%;margin-top:20px;padding:14px;background:#08a878;color:white;border:0;border-radius:7px;font-size:16px;font-weight:bold;cursor:pointer}
#message{margin-top:15px;text-align:center;line-height:1.5;overflow-wrap:anywhere}
.note{font-size:12px;text-align:center;color:#9aabb8;line-height:1.6;margin-top:20px}
</style>
</head>
<body>
<div class="box">
<h1>RIYAZ TRADE</h1>
<div class="subtitle">Demo Trading Platform</div>

<div class="tabs">
<button id="loginTab" class="active" onclick="setMode('login')">Login</button>
<button id="registerTab" onclick="setMode('register')">Register</button>
</div>

<form id="authForm">
<label for="email">Email Address</label>
<input id="email" type="email" placeholder="Enter your email" required autocomplete="email">

<label for="password">Password</label>
<input id="password" type="password" placeholder="At least 6 characters" minlength="6" required autocomplete="current-password">

<button class="submit" id="submitBtn" type="submit">Login</button>
</form>

<div id="message" role="status"></div>
<div class="note">Demo platform only. No real-money trading or deposits.</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAW6sorb-8bvwr_uap10O-xW-EAVl21gmFY",
  authDomain: "riaz-trade.firebaseapp.com",
  projectId: "riaz-trade",
  storageBucket: "riaz-trade.firebasestorage.app",
  messagingSenderId: "29589267273",
  appId: "1:29589267273:web:1290a5e58207e38be67098",
  measurementId: "G-MDRLT0MXME"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let mode = "login";
const form = document.getElementById("authForm");
const message = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");

function setMode(newMode) {
  mode = newMode;
  document.getElementById("loginTab").classList.toggle("active", mode === "login");
  document.getElementById("registerTab").classList.toggle("active", mode === "register");
  submitBtn.textContent = mode === "login" ? "Login" : "Create Account";
  document.getElementById("password").autocomplete =
    mode === "login" ? "current-password" : "new-password";
  message.textContent = "";
}

window.setMode = setMode;

onAuthStateChanged(auth, user => {
  if (user) {
    window.location.replace("dashboard.html");
  }
});

form.addEventListener("submit", async event => {
  event.preventDefault();
  submitBtn.disabled = true;
  message.textContent = "Please wait...";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    if (mode === "register") {
      await createUserWithEmailAndPassword(auth, email, password);
    } else {
      await signInWithEmailAndPassword(auth, email, password);
    }
    window.location.href = "dashboard.html";
  } catch (error) {
    const errors = {
      "auth/email-already-in-use": "This email is already registered. Please log in.",
      "auth/invalid-email": "Please enter a valid email address.",
      "auth/weak-password": "Use a password with at least 6 characters.",
      "auth/invalid-credential": "Incorrect email or password.",
      "auth/network-request-failed": "Network error. Please check your internet connection."
    };
    message.textContent = errors[error.code] || error.message;
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
